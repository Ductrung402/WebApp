<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30">
  <!-- Nền tròn xanh lá đậm -->
  <circle cx="15" cy="15" r="14.5" fill="#1b5232" />

  <!-- Phần Sách Mở (Các nét viền trắng) -->
  <path d="M 6.5,23 Q 11,22.5 15,24.5 Q 19,22.5 23.5,23 L 20,15 Q 16.5,14.5 15,16 Q 13.5,14.5 10,15 Z" 
        fill="none" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M 15,16 L 15,24.5" 
        fill="none" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" />

  <!-- Phần Con Người / Giáo Viên (Nút tròn đầu và thân) -->
  <!-- Đầu -->
  <circle cx="15" cy="11.5" r="1.3" fill="#ffffff" />
  
  <!-- Thân và Vai cách điệu nâng lên từ trang sách -->
  <path d="M 13.5,15.5 C 13.5,14.2 14,13.5 15,13.5 C 16,13.5 16.5,14.2 16.5,15.5 C 16.5,17 15.5,18.5 15,20.5 C 14.5,18.5 13.5,17 13.5,15.5 Z" 
        fill="#ffffff" />

  <!-- Các Tia Sáng Đèn / Tri Thức (5 tia) -->
  <!-- Tia thẳng đứng ở giữa -->
  <line x1="15" y1="9.2" x2="15" y2="7.5" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" />
  
  <!-- Hai tia chéo bên trên -->
  <line x1="12" y1="10" x2="10.5" y2="8.8" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" />
  <line x1="18" y1="10" x2="19.5" y2="8.8" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" />
  
  <!-- Hai tia nằm ngang bên dưới -->
  <line x1="11" y1="12.2" x2="9" y2="12.2" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" />
  <line x1="19" y1="12.2" x2="21" y2="12.2" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" />
</svg>
